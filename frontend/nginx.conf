# Birdy frontend: static SPA plus reverse proxy to the API.
#
# This file is an nginx template. The image copies it to /etc/nginx/templates/default.conf.template
# and the entrypoint renders it with envsubst when the container starts. Only variables that exist
# in the environment are replaced, so nginx's own $variables are left alone.
#
#   BACKEND_UPSTREAM        host:port of the API (default backend:8080)
#   NGINX_LOCAL_RESOLVERS   DNS servers of the container, filled in by the entrypoint from
#                           /etc/resolv.conf because NGINX_ENTRYPOINT_LOCAL_RESOLVERS is set

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 64k;

    # The upstream is resolved at request time (variable + resolver), so nginx starts and
    # `nginx -t` passes even when the backend is not up or its address changes.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $birdy_backend ${BACKEND_UPSTREAM};

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Security headers. `add_header_inherit merge` keeps them in the locations that add their own headers.
    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # REST API: forwarded unchanged (no prefix stripping).
    location /api/ {
        proxy_pass http://$birdy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Chat WebSocket: upgrade headers and a long read timeout so idle rooms stay connected.
    location /ws/ {
        proxy_pass http://$birdy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Content-hashed build output: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated so a new deployment is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes fall back to the shell.
    location / {
        try_files $uri /index.html;
    }
}
